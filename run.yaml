apiVersion: tekton.dev/v1beta1
kind: PipelineRun
metadata:
  name: tax-calculator-run
spec:
  pipelineRef:
    name: tax-calculator-pipeline
  params:
    - name: repo-url
      value: https://github.com/PJAY-OPS/tax-calculator.git
    - name: branch
      value: main
  workspaces:
    - name: shared-workspace
      persistentVolumeClaim:
        claimName: pvc-tax-calculator
